version: '3.8'

# 1. DEFINICIÓN DE LA RED DE COMUNICACIÓN DE TU PROYECTO
networks:
  red_logistica_tambo:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24  # Subred privada simulada para el Almacén Central

services:
  # BASE DE DATOS MYSQL
  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistematambo
    ports:
      - "3307:3306" # Puerto 3307 externo (tu PC) apunta al puerto 3306 interno (servidor MySQL)
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      red_logistica_tambo:
        ipv4_address: 192.168.10.5  # IP Estática asignada al servidor de Base de Datos

  # CONFIGURACIÓN DE TU BACKEND (Añade esta sección si no la tenías abajo)
  backend:
    build: ./backend
    container_name: tambo_backend
    restart: always
    ports:
      - "8080:8080" # Puerto estándar de comunicación para tu API de Java
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://192.168.10.5:3306/sistematambo # Se conecta usando la IP interna fija
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      db:
        condition: service_healthy
    networks:
      red_logistica_tambo:
        ipv4_address: 192.168.10.10  # IP Estática asignada al servidor de Aplicaciones

  # CONFIGURACIÓN DE TU FRONTEND (Añade esta sección si no la tenías abajo)
  frontend:
    build: ./frontend
    container_name: tambo_frontend
    restart: always
    ports:
      - "80:80" # Expone tu aplicación web en el puerto HTTP estándar
    networks:
      red_logistica_tambo:
        ipv4_address: 192.168.10.20  # IP Estática asignada al servidor Web

volumes:
  mysql_data:

