spring.application.name=sistematambo
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sistematambo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.time-zone=America/Lima
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

security.jwt.secret=${SECURITY_JWT_SECRET:TmFtYm8tU2VndXJpZGFkLVByb2Zlc2lvbmFsLTIwMjYtU2VjcmV0S2V5}
security.jwt.access-expiration-ms=${SECURITY_JWT_ACCESS_EXPIRATION_MS:3600000}
security.jwt.refresh-expiration-ms=${SECURITY_JWT_REFRESH_EXPIRATION_MS:604800000}

sunat.api.token=${SUNAT_API_TOKEN:}
